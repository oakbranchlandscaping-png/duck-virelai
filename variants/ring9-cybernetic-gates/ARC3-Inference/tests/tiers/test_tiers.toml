# The test tiers (WO-1, test-runtime infrastructure; Claude, Alpha build seat, 2026-10-13).
# Run with tools/test_tiers.py. Every entry is checked by collection before a tier runs: a named test or file that
# no longer collects fails the run, and so does any node id in the T2 snapshot.
#
# Who runs what:
#   T0  Claude, after every edit of a slice and before parking it; Sol, to check a review correction.
#   T1  Claude, before parking every revision; Sol, while reviewing; the Director, on the copied files.
#   T2  The Director: once after Sol accepts a slice and before its commit, at packaging and release
#       checkpoints, and whenever shared infrastructure (test support, the replay path, conftest) changes.
#
# T0 sets are a slice's fail-first tests and nearest contract guards (target: under 90 s).
# T1 sets are a whole subsystem with its neighbouring interfaces, saved-record guards and goldens (target: under
# five minutes). T2 is the complete suite, less the separately held physics-grammar contract (as before WO-1).

schema = "virelai-test-tiers-v1"
version = 1
weights = "tests/tiers/file_weights.json"  # measured seconds per file: shard balance only, never selection

[T2]
paths = ["tests"]
exclude = ["tests/test_physics_grammar_contract.py"]
snapshot = "tests/tiers/T2_collected.txt"  # every node id here must still collect

